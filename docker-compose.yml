services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erpiso_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/data/erpiso.db
    volumes:
      - erpiso_data:/data
    ports:
      - "5356:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  erpiso_data:
